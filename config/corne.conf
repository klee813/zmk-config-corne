CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=10

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_16=y

CONFIG_ZMK_POINTING=y

# Preserve the compact 128x32 layout and add a host-confirmed CAPS badge on the central OLED.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Explicitly enable the split Bluetooth behavior used by the two halves.
CONFIG_ZMK_SPLIT=y
